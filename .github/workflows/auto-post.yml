name: Автопостинг тренда в Telegram

on:
  schedule:
    - cron: "0 */6 * * *"     # каждые 6 часов (UTC)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длительность, мин (1–30). Пусто = рекомендованная"
        required: false
      publish:
        description: "Публиковать в Telegram"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@koleso_uspeha' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
      TREND_REGION: ${{ vars.TREND_REGION || 'RU' }}
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      - name: Проверка настроек
        id: check
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Нет секрета TELEGRAM_BOT_TOKEN — автопостинг пропущен"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with: { python-version: "3.12", cache: pip }
      - name: Установка
        if: steps.check.outputs.skip != '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Память опубликованных тем
        if: steps.check.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: data/posted.json
          key: posted-${{ github.run_id }}
          restore-keys: posted-
      - name: Найти тренд → видео → Telegram
        if: steps.check.outputs.skip != '1'
        run: |
          ARGS=""
          [ -n "${{ inputs.minutes }}" ] && ARGS="--minutes ${{ inputs.minutes }}" || ARGS="--max-minutes 10"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ "${{ inputs.publish }}" != "false" ]; then ARGS="$ARGS --publish"; fi
          python -m app.cli auto $ARGS
      - name: Видео как артефакт
        if: always() && steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: data/jobs/*/video*.mp4
          retention-days: 7
          if-no-files-found: ignore
